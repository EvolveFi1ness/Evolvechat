name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main        # deploys to your live site
  pull_request:
    branches:
      - main        # runs a check when you merge dev → main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # ── Runs on BOTH dev → main PRs and direct pushes to main ──
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for broken file paths (case sensitivity)
        run: |
          echo "✅ Checking for common issues..."
          # Warn about hardcoded localhost URLs
          if grep -r "localhost" --include="*.html" --include="*.js" .; then
            echo "⚠️  WARNING: Found localhost URLs — these will break in production"
          else
            echo "✅ No localhost URLs found"
          fi

  # ── Only runs when code is merged into main ──
  deploy:
    runs-on: ubuntu-latest
    needs: check          # check must pass before deploying
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # change to 'dist' or 'public' if you have a build step

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
