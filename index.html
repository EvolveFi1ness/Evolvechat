<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolve Fitness – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 4px;
      color: #c9a84c;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 11px;
      color: #555;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #222;
      margin-bottom: 2rem;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active {
      color: #c9a84c;
      border-bottom-color: #c9a84c;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
    }
    .field input,
    .field select {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 12px 14px;
      color: #e8e8e8;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      appearance: none;
    }
    .field input:focus,
    .field select:focus {
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
    }
    .field input::placeholder { color: #333; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      width: 100%;
      background: #c9a84c;
      color: #0a0a0a;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.5rem 0;
      color: #333;
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #222;
    }
    .switch-link {
      text-align: center;
      font-size: 13px;
      color: #555;
    }
    .switch-link span {
      color: #c9a84c;
      cursor: pointer;
    }
    .status {
      margin-top: 1.25rem;
      padding: 11px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
    }
    .status.success {
      background: rgba(29, 158, 117, 0.1);
      border: 1px solid rgba(29, 158, 117, 0.3);
      color: #5dcaa5;
      display: block;
    }
    .status.error {
      background: rgba(226, 75, 74, 0.1);
      border: 1px solid rgba(226, 75, 74, 0.25);
      color: #f09595;
      display: block;
    }
    .status.loading {
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid rgba(201, 168, 76, 0.2);
      color: #c9a84c;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">EVOLVE</div>
  <div class="tagline">Fitness · Performance · Results</div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
    <div class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</div>
  </div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn" id="login-btn" onclick="handleLogin()">Sign In</button>
    <div class="divider">or</div>
    <div class="switch-link">No account? <span onclick="switchTab('signup')">Create one →</span></div>
  </div>

  <!-- SIGNUP FORM -->
  <div id="form-signup" style="display:none">
    <div class="row2">
      <div class="field">
        <label>First Name</label>
        <input type="text" id="su-first" placeholder="Jake">
      </div>
      <div class="field">
        <label>Last Name</label>
        <input type="text" id="su-last" placeholder="Cruz">
      </div>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="su-email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="su-pass" placeholder="Min. 6 characters">
    </div>
    <div class="field">
      <label>Primary Goal</label>
      <select id="su-goal">
        <option value="">Select your goal</option>
        <option value="weight_loss">Weight Loss</option>
        <option value="muscle_gain">Muscle Gain</option>
        <option value="endurance">Endurance</option>
        <option value="general_fitness">General Fitness</option>
      </select>
    </div>
    <button class="btn" id="signup-btn" onclick="handleSignup()">Create Account</button>
    <div class="divider">or</div>
    <div class="switch-link">Already a member? <span onclick="switchTab('login')">Sign in →</span></div>
  </div>

  <div class="status" id="status-msg"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // ── Firebase Config ──────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyAaLdOjRndgq3fw9QfluTW5gmF7VZ26Vag",
    authDomain: "evolvechat-21d6f.firebaseapp.com",
    projectId: "evolvechat-21d6f",
    storageBucket: "evolvechat-21d6f.firebasestorage.app",
    messagingSenderId: "229550101540",
    appId: "1:229550101540:web:2d671f6b3a2809570674b1",
    measurementId: "G-RK177F33Q9"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ── Helpers ──────────────────────────────────────────────────
  function showStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status ' + type;
  }
  function clearStatus() {
    const el = document.getElementById('status-msg');
    el.className = 'status';
    el.textContent = '';
  }
  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    if (btnId === 'login-btn') {
      btn.textContent = loading ? 'Signing in…' : 'Sign In';
    } else {
      btn.textContent = loading ? 'Creating account…' : 'Create Account';
    }
  }

  // ── Tab Switch ───────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('form-login').style.display  = tab === 'login'  ? 'block' : 'none';
    document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
    document.getElementById('tab-login').className  = 'tab' + (tab === 'login'  ? ' active' : '');
    document.getElementById('tab-signup').className = 'tab' + (tab === 'signup' ? ' active' : '');
    clearStatus();
  }

  // ── Login ────────────────────────────────────────────────────
  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    if (!email || !pass) { showStatus('Please fill in all fields.', 'error'); return; }
    setLoading('login-btn', true);
    clearStatus();
    try {
      const cred = await auth.signInWithEmailAndPassword(email, pass);
      showStatus('Welcome back, ' + cred.user.email + '!', 'success');
    } catch (e) {
      showStatus(e.message, 'error');
    } finally {
      setLoading('login-btn', false);
    }
  }

  // ── Sign Up → saves to Firestore ─────────────────────────────
  async function handleSignup() {
    const first = document.getElementById('su-first').value.trim();
    const last  = document.getElementById('su-last').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const pass  = document.getElementById('su-pass').value;
    const goal  = document.getElementById('su-goal').value;

    if (!first || !last || !email || !pass) {
      showStatus('Please fill in all required fields.', 'error');
      return;
    }
    if (pass.length < 6) {
      showStatus('Password must be at least 6 characters.', 'error');
      return;
    }

    setLoading('signup-btn', true);
    clearStatus();

    try {
      // 1. Create user in Firebase Auth
      const cred = await auth.createUserWithEmailAndPassword(email, pass);

      // 2. Save member profile to Firestore → members/{uid}
      await db.collection('members').doc(cred.user.uid).set({
        uid:             cred.user.uid,
        firstName:       first,
        lastName:        last,
        email:           email,
        goal:            goal || null,
        memberSince:     firebase.firestore.FieldValue.serverTimestamp(),
        plan:            'free',
        attendanceCount: 0
      });

      // 3. Update Auth display name
      await cred.user.updateProfile({ displayName: first + ' ' + last });

      showStatus('Account created! Welcome to Evolve, ' + first + '!', 'success');
    } catch (e) {
      showStatus(e.message, 'error');
    } finally {
      setLoading('signup-btn', false);
    }
  }
</script>

</body>
</html>
